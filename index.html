<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Задачи</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0EBE0;
    --card: #FAF7F2;
    --gold: #C9A05A;
    --gold-dark: #A07A38;
    --green: #1A7A3C;
    --blue: #1B3FA0;
    --red: #CC2200;
    --orange: #E8960A;
    --gray: #8A8070;
    --border: #C9A05A;
    --text: #1A1510;
    --text2: #6A5F50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Onest', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .app { max-width: 1100px; margin: 0 auto; padding: 28px 24px 100px; }

  /* HEADER */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; border-bottom: 2px solid var(--border); padding-bottom: 18px; }
  .header-left h1 {
    font-family: 'Onest', sans-serif;
    font-size: 28px; font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--blue);
  }
  .header-left .sub { font-size: 11px; color: var(--text2); margin-top: 4px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }

  /* JELLY BUTTON */
  .add-btn {
    width: 48px; height: 48px; border-radius: 12px;
    background: var(--blue);
    color: white; border: 2px solid var(--blue); font-size: 26px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 4px 0 #0D2570, 0 6px 16px rgba(27,63,160,0.3);
    transition: transform 0.1s cubic-bezier(0.34,1.8,0.64,1), box-shadow 0.1s;
    position: relative; overflow: hidden;
  }
  .add-btn::before {
    content: '';
    position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    width: 55%; height: 26%; border-radius: 50%;
    background: rgba(255,255,255,0.22); pointer-events: none;
  }
  .add-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #0D2570, 0 2px 8px rgba(27,63,160,0.2); }
  .add-btn:hover { transform: translateY(-1px) scale(1.03); }

  /* EISENHOWER QUADRANTS */
  .quadrants { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 480px) { .quadrants { grid-template-columns: 1fr; } }
  .quadrant-box { background: var(--card); border-radius: 10px; border: 1.5px solid #DDD5C4; border-top-width: 4px; padding: 12px; display: flex; flex-direction: column; gap: 8px; transition: background 0.12s, border-color 0.12s; }
  .quadrant-box.drag-over-box { background: #F5F8FF; border-color: var(--blue); }
  .quadrant-box.q1 { border-top-color: var(--blue); }
  .quadrant-box.q2 { border-top-color: var(--gold-dark); }
  .quadrant-title { font-size: 10px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--text2); display: flex; justify-content: space-between; align-items: center; font-family: 'Onest', sans-serif; }
  .quadrant-count { font-size: 10px; color: var(--gray); font-weight: 700; }
  .quadrant-tasks { display: flex; flex-direction: column; gap: 6px; }
  .quadrant-empty { font-size: 11px; color: var(--gray); text-align: center; padding: 10px 0; }

  .qbtn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; margin-bottom: 8px; }
  .qbtn { padding: 10px 6px; border-radius: 8px; border: 1.5px solid #C0B49A; background: transparent; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; cursor: pointer; font-family: 'Onest', sans-serif; line-height: 1.3; color: var(--text2); transition: all 0.12s; }
  .qbtn.active.q1 { background: var(--blue); border-color: var(--blue); color: white; }
  .qbtn.active.q2 { background: var(--gold-dark); border-color: var(--gold-dark); color: white; }

  .archive-toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--card); border: 1.5px solid #DDD5C4; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text2); font-family: 'Onest', sans-serif; }
  .archive-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .archive-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--card); border-radius: 6px; border: 1px solid #DDD5C4; font-size: 13px; cursor: pointer; }
  .archive-row .task-title { font-size: 13px; }

  /* TASK CARDS */
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .empty { text-align: center; color: var(--gray); padding: 48px 0; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }

  .task-card {
    background: var(--card);
    border-radius: 8px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    border: 1.5px solid #DDD5C4;
    border-left: 4px solid var(--gold);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: transform 0.1s, box-shadow 0.1s, border-left-color 0.15s;
  }
  .task-card:active { transform: translateY(1px); box-shadow: none; }
  .task-card.status-done { border-left-color: var(--green); }
  .task-card.important { background: #FFF9EC; border-color: #E8C77A; box-shadow: 0 2px 8px rgba(201,160,90,0.18); }

  .star-btn {
    width: 22px; height: 22px; min-width: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #C0B49A; transition: all 0.15s; flex-shrink: 0;
  }
  .star-btn.active { color: var(--gold-dark); }
  .star-btn:hover { color: var(--gold-dark); transform: scale(1.1); }

  .checkbox {
    width: 22px; height: 22px; min-width: 22px; border-radius: 4px;
    border: 2px solid #C0B49A;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
    background: transparent;
  }
  .checkbox.done { background: var(--green); border-color: var(--green); }
  .checkbox svg { display: none; }
  .checkbox.done svg { display: block; }

  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--text); letter-spacing: 0.2px; }
  .task-title.done { text-decoration: line-through; color: var(--gray); }
  .task-chips { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
  .chip { font-size: 10px; color: var(--text2); background: transparent; border: 1px solid #C0B49A; border-radius: 3px; padding: 2px 7px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
  .chip.overdue { color: var(--red); border-color: var(--red); }

  .status-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* MODAL */
  .overlay { position: fixed; inset: 0; background: rgba(10,8,5,0.55); z-index: 100; display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .overlay.visible { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--card);
    border-radius: 16px 16px 0 0; width: 100%; max-width: 560px; max-height: 92vh;
    display: flex; flex-direction: column;
    transform: translateY(40px); transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
  }
  .overlay.visible .modal { transform: translateY(0); }
  .modal-header { padding: 12px 20px 0; flex-shrink: 0; }
  .modal-handle { width: 36px; height: 3px; background: var(--border); border-radius: 2px; margin: 0 auto 14px; }
  .modal-title { font-family: 'Onest', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; padding-right: 36px; color: var(--text); }
  .modal-close { position: absolute; right: 16px; top: 18px; background: transparent; border: 1.5px solid #C0B49A; border-radius: 4px; width: 30px; height: 30px; cursor: pointer; color: var(--text2); font-size: 13px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .modal-body { padding: 14px 20px 36px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 5px 12px; border-radius: 4px; border: 1.5px solid #C0B49A; background: transparent; color: var(--text2); font-size: 10px; cursor: pointer; font-family: 'Onest', sans-serif; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; transition: all 0.12s; }
  .tab.active { background: var(--red); color: white; border-color: var(--red); }

  label { display: block; font-size: 10px; color: var(--text2); margin-bottom: 4px; margin-top: 14px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border-radius: 6px;
    border: 1.5px solid #C0B49A; font-size: 14px; outline: none;
    background: var(--bg); font-family: 'Onest', sans-serif; color: var(--text);
    transition: border-color 0.15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); background: white; }
  textarea { min-height: 80px; resize: vertical; }

  .status-btns { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .status-btn { padding: 6px 14px; border-radius: 4px; border: 1.5px solid rgba(0,0,0,0.15); font-size: 10px; cursor: pointer; font-weight: 700; font-family: 'Onest', sans-serif; letter-spacing: 1.5px; text-transform: uppercase; transition: all 0.12s; }

  .info-row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #DDD5C4; font-size: 14px; }
  .info-label { color: var(--text2); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; align-self: center; }
  .note-box { background: var(--bg); border-radius: 6px; border: 1.5px solid #C0B49A; padding: 12px 14px; font-size: 14px; line-height: 1.6; margin-top: 12px; color: var(--text); }

  /* MAIN BTN */
  .btn {
    width: 100%; padding: 13px; border-radius: 6px;
    background: var(--blue);
    color: white; border: 2px solid var(--blue); font-size: 11px; font-weight: 700; cursor: pointer; margin-top: 14px;
    font-family: 'Onest', sans-serif; letter-spacing: 2px; text-transform: uppercase;
    box-shadow: 0 4px 0 #0D2570;
    transition: transform 0.1s, box-shadow 0.1s;
    position: relative; overflow: hidden;
  }
  .btn::before {
    content: '';
    position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
    width: 45%; height: 20%; border-radius: 50%;
    background: rgba(255,255,255,0.18); pointer-events: none;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0D2570; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .btn.secondary { background: transparent; color: var(--text); border-color: #C0B49A; box-shadow: 0 4px 0 #C0B49A; }
  .btn.secondary::before { display: none; }
  .btn.danger { background: transparent; color: var(--red); border-color: var(--red); box-shadow: 0 4px 0 rgba(204,34,0,0.3); margin-top: 8px; }
  .btn.danger::before { display: none; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }

  .subtask-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #DDD5C4; cursor: pointer; font-size: 14px; }
  .subtask-row .checkbox { width: 18px; height: 18px; min-width: 18px; border-radius: 3px; }

  .comment-box { background: var(--bg); border-radius: 6px; border: 1.5px solid #C0B49A; padding: 10px 13px; margin-bottom: 8px; }
  .comment-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .comment-author { font-size: 10px; font-weight: 700; color: var(--blue); letter-spacing: 1.5px; text-transform: uppercase; }
  .comment-date { font-size: 11px; color: var(--gray); }
  .comment-text { font-size: 14px; line-height: 1.5; }

  .input-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .input-row input { flex: 1; margin-bottom: 0; }
  .input-row .add-btn { width: 42px; height: 42px; font-size: 20px; flex-shrink: 0; border-radius: 6px; }

  .loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--gray); font-family: 'Onest', sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; background: var(--bg); }

  /* CALENDAR */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-header-cell { text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--text2); padding: 4px 0 8px; font-family: 'Onest', sans-serif; text-transform: uppercase; }
  .cal-cell { background: var(--card); border-radius: 8px; border: 1.5px solid #DDD5C4; padding: 5px 4px; min-height: 70px; cursor: pointer; transition: all 0.12s; overflow: hidden; }
  .cal-cell:hover { border-color: #A0B4E0; }
  .cal-cell.cal-today { border: 1.5px solid var(--gold); background: var(--card); }
  .cal-cell.cal-today .cal-day { color: #8A6A30; font-weight: 700; }
  .cal-cell.cal-selected { border: 1.5px solid var(--blue); background: #EEF2FF; }
  .cal-cell.cal-selected .cal-day { color: var(--blue); font-weight: 700; }
  .cal-cell.cal-today.cal-selected { border: 1.5px solid var(--blue); background: #EEF2FF; }
  .cal-cell.cal-empty { background: transparent; border: none; cursor: default; }
  .cal-day { font-size: 12px; font-weight: 700; color: var(--text); font-family: 'Onest', sans-serif; }

  .drag-handle { color: #C0B49A; font-size: 16px; cursor: grab; padding: 0 4px; user-select: none; flex-shrink: 0; line-height: 1; }
  .drag-handle:active { cursor: grabbing; }
  .task-card.drag-over { border-color: var(--blue); background: #EEF2FF; transform: translateY(-2px); }
  .task-card.dragging { opacity: 0.35; }

  .cal-icon-btn {
    width: 48px; height: 48px; border-radius: 12px;
    background: var(--card); color: var(--blue);
    border: 2px solid var(--border); cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 3px 0 var(--border);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .cal-icon-btn:active { transform: translateY(3px); box-shadow: 0 0px 0 var(--border); }
  .cal-icon-btn.active { background: var(--blue); color: white; border-color: #0D2570; box-shadow: 0 3px 0 #0D2570; }

  @media (max-width: 400px) {
    .header-left h1 { font-size: 22px; }
  }
</style>
</head>

const QUADRANTS = {

async function api(method, path, body) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=representation' : 'return=minimal',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let errText = '';
    try { errText = await res.clone().text(); } catch(e) {}
    console.error(`Supabase ${method} ${path} failed (${res.status}):`, errText);
  }
  if (method === 'GET' || method === 'POST') return res.json();
  return res;
}

async function loadTasks() {
  try {
    const [taskData, eventData] = await Promise.all([
      api('GET', 'tasks?order=created_at.desc'),
      api('GET', 'events?order=date.asc,time_start.asc'),
    ]);
    tasks = Array.isArray(taskData) ? taskData : [];
    events = Array.isArray(eventData) ? eventData : [];
  } catch(e) { tasks = []; events = []; }
  render();
}

function formatDate(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
}

function isOverdue(deadline, status) {
  if (!deadline || status === 'done') return false;
  return new Date(deadline) < new Date();
}

function render() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
  const sub = document.getElementById('sub-text');
  sub.textContent = tasks.length + ' задач · Общий доступ';

  const active = tasks.filter(t => t.status !== 'done');
  const done = tasks.filter(t => t.status === 'done');

  const todayStr = new Date().toISOString().slice(0, 10);

  const grid = document.getElementById('quadrants');
  grid.innerHTML = Object.keys(QUADRANTS).map(qKey => {
    const q = QUADRANTS[qKey];
    const qTasks = active.filter(t => (t.quadrant || 'q2') === qKey);

    // Группа 1: без даты + сегодня (важные первыми, потом остальные)
    const topTasks = qTasks
      .filter(t => !t.deadline || t.deadline.slice(0,10) === todayStr)
      .sort((a,b) => (b.important?1:0) - (a.important?1:0));

    // Группа 2: будущие даты, сортировка по дате, внутри даты важные первыми
    const futureTasks = qTasks
      .filter(t => t.deadline && t.deadline.slice(0,10) > todayStr)
      .sort((a,b) => a.deadline.localeCompare(b.deadline) || (b.important?1:0) - (a.important?1:0));

    // Просроченные (дата в прошлом) — между «сегодня» и будущими, важные первыми
    const overdueTasks = qTasks
      .filter(t => t.deadline && t.deadline.slice(0,10) < todayStr)
      .sort((a,b) => a.deadline.localeCompare(b.deadline) || (b.important?1:0) - (a.important?1:0));

    const sorted = [...topTasks, ...overdueTasks, ...futureTasks];

    let html = '';
    if (topTasks.length && (overdueTasks.length || futureTasks.length)) {
      html = topTasks.map(t => taskCardHTML(t)).join('');
      html += `<div style="height:1px;background:#DDD5C4;margin:4px 0"></div>`;
      html += [...overdueTasks, ...futureTasks].map(t => taskCardHTML(t)).join('');

      html = sorted.map(t => taskCardHTML(t)).join('');

    return `<div class="quadrant-box ${qKey}" data-quadrant="${qKey}" ondragover="dragOverBox(event)" ondrop="dropOnBox(event,'${qKey}')" ondragleave="dragLeaveBox(event)">
      <div class="quadrant-title"><span>${q.short}</span><span class="quadrant-count">${sorted.length}</span></div>

      </div>

  }).join('');

  renderArchive(done);
}

function taskCardHTML(t) {

  }
  if (comms.length) chips.push(`<span class="chip">💬 ${comms.length}</span>`);
  const subsList = subs.length ? `<div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">${subs.map(s=>`
    <div onclick="event.stopPropagation();toggleSubFromCard('${t.id}','${s.id}')" style="display:flex;align-items:center;gap:7px;font-size:13px;color:${s.done?'#9CA3AF':'#374151'};cursor:pointer">
      <div style="width:16px;height:16px;min-width:16px;border-radius:4px;border:1.5px solid ${s.done?'#1A7A3C':'#C0B49A'};background:${s.done?'#1A7A3C':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s">
        ${s.done?'<svg width="8" height="8" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>':''}
      </div>
      <span style="text-decoration:${s.done?'line-through':'none'}">${s.text}</span>

    <div class="checkbox ${cbClass}" onclick="event.stopPropagation();toggleDone('${t.id}')">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/></svg>

        <div class="task-title${t.status==='done'?' done':''}" style="font-size:13px">${t.title}</div>
        <div onclick="event.stopPropagation();quickDeleteTask('${t.id}')" style="width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#C0B49A;font-size:14px;cursor:pointer;line-height:1;flex-shrink:0" title="Удалить">×</div>

      ${chips.length ? `<div class="task-chips">${chips.join('')}</div>` : ''}
      ${subsList}

  </div>`;
}

async function toggleImportant(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const important = !t.important;
  tasks = tasks.map(x => x.id === id ? {...x, important} : x);
  if (currentTask?.id === id) {
    currentTask = {...currentTask, important};
    renderDetail();
  }
  render();
  await api('PATCH', `tasks?id=eq.${id}`, { important });
}

async function toggleDone(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;

  // Если задача повторяющаяся и её отмечают выполненной — двигаем на следующую дату
  if (t.recurrence && t.recurrence !== 'none' && t.status !== 'done') {
    const nextDate = getNextRecurrenceDate(t);
    if (nextDate) {
      const patch = { deadline: nextDate, status: 'todo' };
      tasks = tasks.map(x => x.id === id ? {...x, ...patch} : x);
      render();
      await api('PATCH', `tasks?id=eq.${id}`, patch);
      return;
    }
  }

  const newStatus = t.status === 'done' ? 'todo' : 'done';
  tasks = tasks.map(x => x.id === id ? {...x, status: newStatus} : x);
  if (currentTask?.id === id) {
    currentTask = {...currentTask, status: newStatus};
    renderDetail();
  }
  render();
  await api('PATCH', `tasks?id=eq.${id}`, { status: newStatus });
  if (newStatus === 'done') await sendTelegram(`☑️ Выполнено: ${t.title}`);
}

function getNextRecurrenceDate(t) {
  const base = t.deadline ? new Date(t.deadline + 'T12:00:00') : new Date();
  const today = new Date();
  today.setHours(12,0,0,0);

  if (t.recurrence === 'daily') {
    const next = new Date(Math.max(base.getTime(), today.getTime()));
    next.setDate(next.getDate() + 1);
    return next.toISOString().slice(0,10);
  }
  if (t.recurrence === 'weekly') {
    const next = new Date(Math.max(base.getTime(), today.getTime()));
    next.setDate(next.getDate() + 7);
    return next.toISOString().slice(0,10);
  }
  if (t.recurrence === 'monthly') {
    const next = new Date(Math.max(base.getTime(), today.getTime()));
    next.setMonth(next.getMonth() + 1);
    return next.toISOString().slice(0,10);
  }
  if (t.recurrence === 'weekday' && t.recurrence_days && t.recurrence_days.length) {
    const next = new Date(Math.max(base.getTime(), today.getTime()));
    next.setDate(next.getDate() + 1);
    for (let i = 0; i < 14; i++) {
      const dow = next.getDay();
      if (t.recurrence_days.includes(dow)) return next.toISOString().slice(0,10);
      next.setDate(next.getDate() + 1);
    }
  }
  if (t.recurrence === 'monthday' && t.recurrence_days && t.recurrence_days.length) {
    const days = [...t.recurrence_days].sort((a,b) => a - b);
    const next = new Date(Math.max(base.getTime(), today.getTime()));
    next.setDate(next.getDate() + 1);
    // ищем ближайшее подходящее число в текущем или следующих месяцах
    for (let m = 0; m < 3; m++) {
      const year = next.getFullYear();
      const month = next.getMonth();
      for (const d of days) {
        const candidate = new Date(year, month, d, 12);
        if (candidate >= next) return candidate.toISOString().slice(0,10);
      }
      next.setMonth(next.getMonth() + 1);
      next.setDate(1);
    }
  }
  return null;
}

// Override renderCalendar to include events
function renderCalendar() {
  const now = new Date();
  const year = calYear;
  const month = calMonth;

  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const dayNames = ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDow = (firstDay.getDay() + 6) % 7;
  const totalDays = lastDay.getDate();

  const tasksByDay = {};
  tasks.forEach(t => {
    if (t.deadline) {
      const d = t.deadline.slice(0,10);
      if (!tasksByDay[d]) tasksByDay[d] = [];
      tasksByDay[d].push(t);
    }
    // Recurring tasks
    if (t.recurrence && t.recurrence !== 'none') {
      const start = t.deadline ? new Date(t.deadline) : new Date();
      for (let d = 1; d <= totalDays; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const date = new Date(dateStr);
        if (t.deadline && dateStr <= t.deadline.slice(0,10)) continue;
        let matches = false;
        if (t.recurrence === 'daily') matches = true;
        else if (t.recurrence === 'weekly') matches = (date - start) % (7*86400000) === 0;
        else if (t.recurrence === 'monthly') matches = date.getDate() === start.getDate();
        else if (t.recurrence === 'weekday' && t.recurrence_days) {
          const dow = date.getDay();
          matches = t.recurrence_days.includes(dow);
        }
        else if (t.recurrence === 'monthday' && t.recurrence_days) {
          matches = t.recurrence_days.includes(date.getDate());
        }
        if (matches) {
          if (!tasksByDay[dateStr]) tasksByDay[dateStr] = [];
          if (!tasksByDay[dateStr].find(x => x.id === t.id)) tasksByDay[dateStr].push({...t, isRecurring: true});
        }
      }
    }
  });

  const eventsByDay = {};
  events.forEach(e => {
    if (!eventsByDay[e.date]) eventsByDay[e.date] = [];
    eventsByDay[e.date].push(e);
  });

  const STATUS_COLORS = { todo: '#C9A05A', inprogress: '#E8960A', done: '#1A7A3C' };

  let cells = '';
  for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell cal-empty"></div>`;

  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayTasks = tasksByDay[dateStr] || [];
    const dayEvents = eventsByDay[dateStr] || [];
    const isToday = d === now.getDate() && month === now.getMonth() && year === now.getFullYear();

    const eventItems = dayEvents.slice(0,2).map(e =>
      `<div style="font-size:9px;font-weight:700;color:white;background:var(--blue);border-radius:3px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:2px">${e.time_start ? e.time_start.slice(0,5)+' ' : ''}${e.title}</div>`
    ).join('');
    const taskItems = dayTasks.slice(0, dayEvents.length > 0 ? 1 : 2).map(t =>
      `<div style="font-size:9px;font-weight:600;color:var(--text);background:${t.isRecurring?'#FFF3DC':'#EDE5D4'};border-radius:3px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:2px;border-left:2px solid ${STATUS_COLORS[t.status]||'#C9A05A'}">${t.title}</div>`
    ).join('');
    const moreCount = (dayEvents.length + dayTasks.length) - (dayEvents.slice(0,2).length + dayTasks.slice(0, dayEvents.length > 0 ? 1 : 2).length);

    cells += `<div class="cal-cell${isToday?' cal-today':''}" data-date="${dateStr}" onclick="showDayTasks('${dateStr}')">
      <div class="cal-day">${d}</div>
      ${eventItems}${taskItems}
      ${moreCount > 0 ? `<div style="font-size:9px;color:var(--text2);font-weight:700;margin-top:1px">+${moreCount} ещё</div>` : ''}
    </div>`;
  }

  const cal = document.getElementById('calendar-view');
  cal.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <button onclick="prevMonth()" style="width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--border)">‹</button>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="font-family:'Onest',sans-serif;font-weight:700;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--blue)">${monthNames[month]} ${year}</div>
        ${(year !== now.getFullYear() || month !== now.getMonth()) ? `<button onclick="goToday()" style="font-size:10px;font-weight:700;font-family:'Onest',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--text2);background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:3px 8px;cursor:pointer">сегодня</button>` : ''}
      </div>
      <button onclick="nextMonth()" style="width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--border)">›</button>
    </div>
    <div class="cal-grid">
      ${dayNames.map(d => `<div class="cal-header-cell">${d}</div>`).join('')}
      ${cells}
    </div>
    <div id="day-tasks" style="margin-top:18px"></div>
  `;
}

function showDayTasks(dateStr) {
  // Highlight selected cell
  document.querySelectorAll('.cal-cell[data-date]').forEach(c => c.classList.remove('cal-selected'));
  const target = document.querySelector(`.cal-cell[data-date="${dateStr}"]`);
  if (target) target.classList.add('cal-selected');

  const dayTasks = tasks.filter(t => t.deadline && t.deadline.slice(0,10) === dateStr);
  const dayEvents = events.filter(e => e.date === dateStr).sort((a,b) => (a.time_start||'').localeCompare(b.time_start||''));
  const d = new Date(dateStr + 'T12:00:00');
  const label = d.toLocaleDateString('ru-RU', { day:'numeric', month:'long', weekday:'long' });
  const STATUS = { todo: { dot:'#C9A05A' }, inprogress: { dot:'#E8960A' }, done: { dot:'#1A7A3C' } };

  const container = document.getElementById('day-tasks');
  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--text2)">${label}</div>
      <button onclick="openAddEvent('${dateStr}')" style="background:var(--blue);color:white;border:none;border-radius:6px;padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-family:'Onest',sans-serif;cursor:pointer;box-shadow:0 3px 0 #0D2570">+ Мероприятие</button>
    </div>`;

  if (dayEvents.length) {
    html += `<div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--blue);margin-bottom:8px">Мероприятия</div>`;
    dayEvents.forEach(ev => {
      const evTasks = (ev.task_ids||[]).map(id => tasks.find(t=>t.id===id)).filter(Boolean);
      html += `<div style="background:var(--card);border-radius:10px;border:2px solid #BFCFFF;border-left:4px solid var(--blue);padding:12px 14px;margin-bottom:8px;cursor:pointer" onclick="openEventDetail('${ev.id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="font-weight:700;font-size:14px;color:var(--text)">${ev.title}</div>
          ${ev.time_start ? `<div style="font-size:11px;font-weight:700;color:var(--blue);letter-spacing:1px;white-space:nowrap;margin-left:8px">${ev.time_start}${ev.time_end?' – '+ev.time_end:''}</div>` : ''}
        </div>
        ${ev.note ? `<div style="font-size:12px;color:var(--text2);margin-top:4px">${ev.note}</div>` : ''}
        ${evTasks.length ? `<div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">
          ${evTasks.map(t=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:${t.status==='done'?'#9CA3AF':'var(--text)'}">
            <div style="width:6px;height:6px;border-radius:1px;background:${STATUS[t.status]?.dot||'#C9A05A'}"></div>
            <span style="text-decoration:${t.status==='done'?'line-through':'none'}">${t.title}</span>
          </div>`).join('')}
        </div>` : ''}
      </div>`;
    });
  }

  if (dayTasks.length) {
    html += `<div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--text2);margin:12px 0 8px">Задачи</div>`;
    dayTasks.forEach(t => {
      const st = STATUS[t.status] || STATUS.todo;
      const cbClass = t.status==='done'?'done':t.status==='inprogress'?'inprogress':'';
      html += `<div class="task-card" style="margin-bottom:8px" onclick="openDetail('${t.id}')">
        <div class="checkbox ${cbClass}" onclick="event.stopPropagation();toggleDone('${t.id}')">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </div>
        <div class="task-body">
          <div class="task-title${t.status==='done'?' done':''}">${t.title}</div>
          ${t.assignee?`<div class="task-chips"><span class="chip">${t.assignee}</span></div>`:''}
        </div>
        <div class="status-dot" style="background:${st.dot}"></div>
      </div>`;
    });
  }

  if (!dayTasks.length && !dayEvents.length) {
    html += `<div style="text-align:center;color:var(--gray);padding:20px 0;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700">Нет событий на этот день</div>`;
  }

  container.innerHTML = html;
}

// ADD EVENT MODAL
let currentEventDate = '';
function openAddEvent(dateStr) {
  currentEventDate = dateStr;
  document.getElementById('ev-title').value = '';
  document.getElementById('ev-time-start').value = '';
  document.getElementById('ev-time-end').value = '';
  document.getElementById('ev-note').value = '';
  newEventTasks = [];
  renderEventTaskPicker([]);
  renderNewEventTasks();
  document.getElementById('event-overlay').classList.add('visible');
  // Scroll modal to top
  setTimeout(() => {
    const body = document.querySelector('#event-overlay .modal-body');
    if (body) body.scrollTop = 0;
    document.getElementById('ev-title').focus();
  }, 100);
}
function closeEventModal(e) {
  if (e && e.target !== document.getElementById('event-overlay')) return;
  document.getElementById('event-overlay').classList.remove('visible');
}

let selectedTaskIds = [];
let newEventTasks = [];

function renderNewEventTasks() {
  const container = document.getElementById('ev-new-tasks-list');
  if (!container) return;
  container.innerHTML = newEventTasks.map((t, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #EDE5D4;font-size:13px;color:var(--text2)">
      <span style="color:var(--gray)">○</span>
      <span style="flex:1">${t.title}</span>
      <span style="font-size:11px;color:var(--text2)">${t.assignee}</span>
    </div>`).join('');
}

function addNewEventTask() {
  const title = document.getElementById('ev-new-task-input').value.trim();
  const assignee = document.getElementById('ev-new-task-assignee-sel').value;
  if (!title) return;
  newEventTasks.push({ title, assignee });
  document.getElementById('ev-new-task-input').value = '';
  renderNewEventTasks();
  document.getElementById('ev-new-task-input').focus();
}
function renderEventTaskPicker(selected) {
  selectedTaskIds = [...selected];
  const container = document.getElementById('ev-task-picker');
  if (!tasks.length) { container.innerHTML = '<div style="font-size:12px;color:var(--gray)">Нет задач</div>'; return; }
  container.innerHTML = tasks.filter(t=>t.status!=='done').map(t => {
    const checked = selectedTaskIds.includes(t.id);
    return `<div onclick="toggleEventTask('${t.id}')" style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #EDE5D4;cursor:pointer">
      <div style="width:18px;height:18px;border-radius:4px;border:2px solid ${checked?'var(--blue)':'#C0B49A'};background:${checked?'var(--blue)':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        ${checked?'<svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/></svg>':''}
      </div>
      <span style="font-size:13px;color:var(--text)">${t.title}</span>
    </div>`;
  }).join('');
}
function toggleEventTask(id) {
  if (selectedTaskIds.includes(id)) selectedTaskIds = selectedTaskIds.filter(x=>x!==id);
  else selectedTaskIds.push(id);
  renderEventTaskPicker(selectedTaskIds);
}

async function submitEvent() {
  const title = document.getElementById('ev-title').value.trim();
  if (!title) return;

  // Create new tasks first
  const createdIds = [];
  for (const t of newEventTasks) {
    const task = {
      id: (Date.now() + Math.random()).toString(),
      title: t.title,
      status: 'todo',
      assignee: t.assignee,
      deadline: currentEventDate,
      note: '', subtasks: [], comments: [],
    };
    tasks.unshift(task);
    createdIds.push(task.id);
    await api('POST', 'tasks', task);
  }

  const ev = {
    id: Date.now().toString(),
    title,
    date: currentEventDate,
    time_start: document.getElementById('ev-time-start').value || null,
    time_end: document.getElementById('ev-time-end').value || null,
    note: document.getElementById('ev-note').value || '',
    task_ids: [...selectedTaskIds, ...createdIds],
  };
  document.getElementById('event-overlay').classList.remove('visible');
  events.push(ev);
  renderCalendar();
  showDayTasks(currentEventDate);
  render();
  await api('POST', 'events', ev);
}

// EVENT DETAIL
function openEventDetail(id) {
  currentEvent = events.find(e => e.id === id);
  if (!currentEvent) return;
  renderEventDetail();
  document.getElementById('event-detail-overlay').classList.add('visible');
}

function renderEventDetail() {
  const ev = currentEvent;
  if (!ev) return;
  const evTasks = (ev.task_ids||[]).map(id => tasks.find(t=>t.id===id)).filter(Boolean);
  const d = new Date(ev.date + 'T12:00:00');
  const dateLabel = d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
  const STATUS = { todo: { dot:'#C9A05A' }, inprogress: { dot:'#E8960A' }, done: { dot:'#1A7A3C' } };

  document.getElementById('event-detail-title').textContent = ev.title;
  document.getElementById('event-detail-body').innerHTML = `
    <div class="info-row"><span class="info-label">Дата</span><span>${dateLabel}</span></div>
    ${ev.time_start ? `<div class="info-row"><span class="info-label">Время</span><span style="font-weight:700;color:var(--blue)">${ev.time_start}${ev.time_end?' – '+ev.time_end:''}</span></div>` : ''}
    ${ev.note ? `<div class="note-box" style="margin-top:12px">${ev.note}</div>` : ''}

    <div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px">
      <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--text2)">Задачи (${evTasks.length})</div>
      <button onclick="showNewTaskInEvent()" style="background:var(--blue);color:white;border:none;border-radius:5px;padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-family:'Onest',sans-serif;cursor:pointer;box-shadow:0 2px 0 #0D2570">+ Задача</button>
    </div>

    <div id="ev-new-task-form" style="display:none;background:var(--bg);border-radius:10px;padding:12px;margin-bottom:10px;border:1.5px solid var(--border)">
      <input id="ev-new-task-title" placeholder="Название задачи..." style="width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #C0B49A;font-size:14px;outline:none;background:white;font-family:'Onest',sans-serif;color:var(--text);margin-bottom:8px">
      <select id="ev-new-task-assignee" style="width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #C0B49A;font-size:14px;outline:none;background:white;font-family:'Onest',sans-serif;color:var(--text);margin-bottom:8px">
        ${USERS.map(u=>`<option>${u}</option>`).join('')}
      </select>
      <div style="display:flex;gap:8px">
        <button onclick="submitNewTaskInEvent()" style="flex:1;padding:9px;border-radius:8px;background:var(--blue);color:white;border:none;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-family:'Onest',sans-serif;cursor:pointer">Добавить</button>
        <button onclick="document.getElementById('ev-new-task-form').style.display='none'" style="padding:9px 14px;border-radius:8px;background:#EDE5D4;color:var(--text);border:none;font-size:11px;font-weight:700;font-family:'Onest',sans-serif;cursor:pointer">Отмена</button>
      </div>
    </div>

    ${evTasks.length ? evTasks.map(t => {
      const st = STATUS[t.status] || STATUS.todo;
      const cbClass = t.status==='done'?'done':t.status==='inprogress'?'inprogress':'';
      return `<div class="task-card" style="margin-bottom:8px">
        <div class="checkbox ${cbClass}" onclick="toggleDoneInEvent('${t.id}')">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </div>
        <div class="task-body" onclick="openTaskFromEvent('${t.id}')">
          <div class="task-title${t.status==='done'?' done':''}">${t.title}</div>
          ${t.assignee?`<div class="task-chips"><span class="chip">${t.assignee}</span></div>`:''}
        </div>
        <div class="status-dot" style="background:${st.dot}"></div>
      </div>`;
    }).join('') : `<div style="text-align:center;color:var(--gray);padding:16px 0;font-size:12px;letter-spacing:1px;font-weight:700">Нет задач</div>`}

    <button class="btn danger" onclick="deleteEvent('${ev.id}')">Удалить мероприятие</button>
  `;
}

function showNewTaskInEvent() {
  const form = document.getElementById('ev-new-task-form');
  form.style.display = form.style.display === 'none' ? '' : 'none';
  if (form.style.display !== 'none') document.getElementById('ev-new-task-title').focus();
}

async function submitNewTaskInEvent() {
  const title = document.getElementById('ev-new-task-title').value.trim();
  if (!title) return;
  const task = {
    id: Date.now().toString(),
    title,
    status: 'todo',
    assignee: document.getElementById('ev-new-task-assignee').value,
    deadline: currentEvent.date,
    note: '',
    subtasks: [],
    comments: [],
  };
  tasks.unshift(task);
  const newTaskIds = [...(currentEvent.task_ids||[]), task.id];
  currentEvent = {...currentEvent, task_ids: newTaskIds};
  events = events.map(e => e.id===currentEvent.id ? currentEvent : e);
  renderEventDetail();
  render();
  await Promise.all([
    api('POST', 'tasks', task),
    api('PATCH', `events?id=eq.${currentEvent.id}`, { task_ids: newTaskIds }),
  ]);
}

async function toggleDoneInEvent(taskId) {
  const t = tasks.find(x => x.id === taskId);
  if (!t) return;
  const newStatus = t.status === 'done' ? 'todo' : 'done';
  tasks = tasks.map(x => x.id === taskId ? {...x, status: newStatus} : x);
  renderEventDetail();
  render();
  await api('PATCH', `tasks?id=eq.${taskId}`, { status: newStatus });
}

function openTaskFromEvent(taskId) {
  document.getElementById('event-detail-overlay').classList.remove('visible');
  setTimeout(() => {
    currentTask = tasks.find(t => t.id === taskId);
    if (!currentTask) return;
    currentTab = 'info';
    renderDetail();
    document.getElementById('detail-overlay').classList.add('visible');
  }, 200);
}
function closeEventDetail(e) {
  if (e && e.target !== document.getElementById('event-detail-overlay')) return;
  document.getElementById('event-detail-overlay').classList.remove('visible');
}
async function deleteEvent(id) {
  if (!confirm('Удалить мероприятие?')) return;
  events = events.filter(e => e.id !== id);
  document.getElementById('event-detail-overlay').classList.remove('visible');
  renderCalendar();
  await api('DELETE', `events?id=eq.${id}`);
}

// DRAG AND DROP
let dragSrcId = null;

function dragStart(e) {
  dragSrcId = e.currentTarget.dataset.id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function dragOver(e) {
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.task-card').forEach(c => c.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
  document.querySelectorAll('.quadrant-box').forEach(b => b.classList.remove('drag-over-box'));
  const box = e.currentTarget.closest('.quadrant-box');
  if (box) box.classList.add('drag-over-box');
}

async function dragDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  const targetId = e.currentTarget.dataset.id;
  const targetQuadrant = e.currentTarget.dataset.quadrant || 'q2';
  document.querySelectorAll('.quadrant-box').forEach(b => b.classList.remove('drag-over-box'));
  if (!dragSrcId || dragSrcId === targetId) return;

  const srcIdx = tasks.findIndex(t => t.id === dragSrcId);
  const tgtIdx = tasks.findIndex(t => t.id === targetId);
  if (srcIdx === -1 || tgtIdx === -1) return;

  const movedQuadrantChanged = tasks[srcIdx].quadrant !== targetQuadrant;

  const newTasks = [...tasks];
  const [moved] = newTasks.splice(srcIdx, 1);
  moved.quadrant = targetQuadrant;
  const newTgtIdx = newTasks.findIndex(t => t.id === targetId);
  newTasks.splice(newTgtIdx, 0, moved);
  tasks = newTasks;
  render();

  if (movedQuadrantChanged) {
    await api('PATCH', `tasks?id=eq.${moved.id}`, { quadrant: targetQuadrant });
  }
}

function dragOverBox(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.task-card').forEach(c => c.classList.remove('drag-over'));
  document.querySelectorAll('.quadrant-box').forEach(b => b.classList.remove('drag-over-box'));
  e.currentTarget.classList.add('drag-over-box');
}

function dragLeaveBox(e) {
  if (e.currentTarget.contains(e.relatedTarget)) return;
  e.currentTarget.classList.remove('drag-over-box');
}

async function dropOnBox(e, qKey) {
  e.preventDefault();
  document.querySelectorAll('.quadrant-box').forEach(b => b.classList.remove('drag-over-box'));
  if (!dragSrcId) return;
  await moveTaskToQuadrant(dragSrcId, qKey);
}

async function moveTaskToQuadrant(id, quadrant) {
  const t = tasks.find(x => x.id === id);
  if (!t || t.quadrant === quadrant) return;
  tasks = tasks.map(x => x.id === id ? {...x, quadrant} : x);
  if (currentTask?.id === id) {
    currentTask = {...currentTask, quadrant};
  }
  render();
  await api('PATCH', `tasks?id=eq.${id}`, { quadrant });
}

function dragEnd(e) {
  document.querySelectorAll('.task-card').forEach(c => {
    c.classList.remove('dragging');
    c.classList.remove('drag-over');
  });
  document.querySelectorAll('.quadrant-box').forEach(b => b.classList.remove('drag-over-box'));
  dragSrcId = null;
}

// Генерируем кнопки чисел месяца
(function() {
  const container = document.getElementById('monthday-buttons');
  if (!container) return;
  const btnStyle = 'width:34px;height:34px;border-radius:6px;border:1.5px solid #C0B49A;background:transparent;font-size:11px;font-weight:700;font-family:\'Onest\',sans-serif;cursor:pointer;color:var(--text2)';
  for (let d = 1; d <= 31; d++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = d;
    btn.dataset.mday = d;
    btn.style.cssText = btnStyle;
    btn.onclick = function() { toggleMonthDay(d, btn); };
    container.appendChild(btn);
  }
})();

loadTasks();
</script>
